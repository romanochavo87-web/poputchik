az:'<h2>Qaydalar</h2><ol><li>Usta tap yalnız ustaları müştərilərlə tanış edir. Biz xidmət göstərmirik və işin keyfiyyətinə, qiymətə və ödənişə görə cavabdeh deyilik. Qiyməti usta ilə müştəri özləri razılaşdırır.</li><li>Usta yalnız həqiqətən bacardığı xidmətləri seçməli və düzgün nömrə yazmalıdır.</li><li>Aldatma, kobudluq və saxta profillər qadağandır. Şikayət olarsa, administrator profili gizlədə bilər.</li></ol><h3>Məlumatlar</h3><ul><li>Ustanın adı, telefonu, xidmətləri və rayonları hamıya görünür — müştərilər zəng etsin deyə.</li><li>Məlumatlar heç kimə satılmır. Profilinizi istənilən vaxt özünüz silə bilərsiniz və ya WhatsApp ilə yazın: +994 55 848 20 41.</li></ul>',

$('list').onclick=function(e){var id=e.target.dataset&&e.target.dataset.rep;if(!id||!ready())return;
  openDlg('<h2>'+T('report')+'</h2><label for="rr">'+T('reason')+'</label><select id="rr">'+['r1','r2','r3','r4','r5'].map(function(k){return '<option>'+T(k)+'</option>'}).join('')+'</select><label for="rt">'+T('details')+'</label><input id="rt" type="text" placeholder="'+T('detailsPh')+'"><button class="btn p" id="rs" type="button" style="width:100%">'+T('sendRep')+'</button><button class="btn" id="rc" type="button" style="width:100%">'+T('cancel')+'</button>');
  $('rc').onclick=closeDlg;$('rs').onclick=function(){sb.from('master_reports').insert({reporter_id:me,master_id:id,reason:$('rr').value,details:$('rt').value.trim().slice(0,500)||null}).then(function(r){if(r.error)return fail(r.error);say(T('repSent'))})}};

function drawMe(){
  var m=mine||{name:'',phone:'',services:[],districts:[],about:''};
  $('meT').textContent=T(mine?'myT':'regT');$('meSub').textContent=mine&&mine.is_hidden?T('hiddenNote'):T(mine?'mySub':'regSub');
  $('meBody').innerHTML='<label for="fn">'+T('name')+'</label><input id="fn" type="text" maxlength="40" autocomplete="given-name" value="'+esc(m.name)+'">'+
  '<label for="fp">'+T('phone')+'</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="'+T('phonePh')+'" value="'+esc(m.phone?prettyPhone(m.phone):'')+'">'+
  '<label>'+T('svcL')+'</label><div class="checks">'+SVC.map(function(s){return '<label><input type="checkbox" name="fs" value="'+s[0]+'"'+(m.services.indexOf(s[0])>-1?' checked':'')+'>'+s[1]+' '+T(s[0])+'</label>'}).join('')+'</div>'+
  '<label>'+T('distsL')+'</label><div class="checks">'+DIST.map(function(d){return '<label><input type="checkbox" name="fd" value="'+esc(d[0])+'"'+(m.districts.indexOf(d[0])>-1?' checked':'')+'>'+esc(dn(d[0]))+'</label>'}).join('')+'</div>'+
  '<label for="fa">'+T('about')+'</label><textarea id="fa" maxlength="300" placeholder="'+T('aboutPh')+'">'+esc(m.about||'')+'</textarea>'+
  (mine?'':'<label class="agree"><input type="checkbox" id="fag"><span>'+T('agree')+' <button class="linkbtn" type="button" data-rules="1">'+T('rulesL')+'</button></span></label>')+
  '<button class="btn p" id="fsave" type="button" style="width:100%">'+T(mine?'update':'save')+'</button>'+(mine?'<button class="btn danger" id="fdel" type="button" style="width:100%">'+T('del')+'</button>':'');
  $('fsave').onclick=saveMe;if(mine)$('fdel').onclick=function(){ask(T('askDel'),function(){sb.from('masters').delete().eq('id',mine.id).then(function(r){if(r.error)return fail(r.error);mine=null;load()})})};
}
function vals(n){return Array.prototype.slice.call(document.querySelectorAll('input[name='+n+']:checked')).map(function(x){return x.value})}
function saveMe(){
  if(!ready())return;
  var name=$('fn').value.trim(),phone=normPhone($('fp').value),s=vals('fs'),d=vals('fd'),about=$('fa').value.trim().slice(0,300)||null;
  if(name.length<2)return say(T('needName'));if(!phone)return say(T('needPhone'));if(!s.length)return say(T('needSvc'));if(!d.length)return say(T('needDist'));
  if(!mine&&!$('fag').checked)return say(T('needAgree'));
  var row={name:name.slice(0,40),phone:phone,services:s,districts:d,about:about};
  $('fsave').disabled=true;
  var q=mine?sb.from('masters').update(row).eq('id',mine.id):sb.from('masters').insert(Object.assign({user_id:me},row));
  q.then(function(r){$('fsave').disabled=false;if(r.error)return fail(r.error);say(T('saved'));load()});
}

function load(){
  if(!sb)return;
  return sb.from('masters').select('*').order('created_at',{ascending:false}).then(function(r){
    if(r.error)return console.error(r.error);masters=r.data||[];mine=me?masters.find(function(m){return m.user_id===me})||null:null;render();drawMe();if($('adm').style.display!=='none')drawAdm();
  });
}
var reps=[];
function drawAdm(){
  $('admList').innerHTML='<h2 style="margin-top:14px">'+T('masters')+' ('+masters.length+')</h2>'+masters.map(function(m){return '<div class="card"><b>'+esc(m.name)+'</b> '+(m.is_hidden?'<span class="small">('+T('hidden')+')</span>':'')+'<div class="small">'+prettyPhone(m.phone)+' · '+m.services.map(T).join(', ')+' · '+m.districts.map(dn).join(', ')+'</div><button class="btn'+(m.is_hidden?'':' danger')+'" type="button" data-hide="'+m.id+'" data-v="'+(m.is_hidden?0:1)+'">'+T(m.is_hidden?'show':'hide')+'</button></div>'}).join('')+
  '<h2 style="margin-top:14px">'+T('reps')+'</h2>'+(reps.map(function(r){var m=masters.find(function(x){return x.id===r.master_id});return '<div class="card"><b>'+esc(r.reason)+'</b><div class="small">'+(m?esc(m.name)+' · ':'')+esc(r.details||'')+' · '+new Date(r.created_at).toLocaleString()+'</div>'+(r.status==='open'?'<button class="btn" type="button" data-rc="'+r.id+'">'+T('closeRep')+'</button>':'')+'</div>'}).join('')||'<div class="empty">'+T('noReps')+'</div>');
}
function loadAdm(){Promise.all([load(),sb.from('master_reports').select('*').order('created_at',{ascending:false}).limit(200)]).then(function(r){reps=(r[1]&&r[1].data)||[];drawAdm()})}
$('admBtn').onclick=function(){
  if(!ready())return;
  if($('adm').style.display!=='none'){$('adm').style.display='none';return}
  if(!isAdmin){openDlg('<p>'+T('notAdmin')+'</p><input type="text" readonly value="'+esc(me)+'" style="font-size:13px" onclick="this.select()"><button class="btn p" id="okb" type="button" style="width:100%">'+T('ok')+'</button>');$('okb').onclick=closeDlg;return}
  $('adm').style.display='';loadAdm();$('adm').scrollIntoView({behavior:'smooth'});
};
$('admReload').onclick=loadAdm;
$('adm').onclick=function(e){var d=e.target.dataset||{};
  if(d.hide)sb.from('masters').update({is_hidden:d.v==='1'}).eq('id',d.hide).then(function(r){if(r.error)return fail(r.error);loadAdm()});
  if(d.rc)sb.from('master_reports').update({status:'closed'}).eq('id',d.rc).then(function(r){if(r.error)return fail(r.error);loadAdm()});
};

var SITE='https://poputchik-az.netlify.app/usta';
(function(){var box=$('qrBox');
  try{if(!window.qrcode)throw 0;var q=qrcode(0,'M');q.addData(SITE);q.make();box.innerHTML=q.createSvgTag(4,2);var sv=box.querySelector('svg');if(sv){sv.removeAttribute('width');sv.removeAttribute('height');sv.setAttribute('role','img');sv.setAttribute('aria-label','QR: poputchik-az.netlify.app/usta')}}
  catch(e){box.innerHTML='<img alt="QR: poputchik-az.netlify.app/usta" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='+encodeURIComponent(SITE)+'">'}
})();
$('qrPrint').onclick=function(){window.print()};
$('qrShare').onclick=function(){
  if(navigator.share){navigator.share({title:'Usta tap',text:T('h1'),url:SITE}).catch(function(){});return}
  (navigator.clipboard?navigator.clipboard.writeText(SITE):Promise.reject()).then(function(){say(T('copied'))}).catch(function(){say(SITE)});
};
setLang(lang);
(function init(){
  if(!window.supabase){$('banner').style.display='';$('banner').textContent=T('authErr');return}
  sb=window.supabase.createClient('https://iuqpjveevfurufvedfnf.supabase.co','sb_publishable_jR3NDpiVgqTGK43HnDO2Xw_NhGxxxap',{auth:{persistSession:true,autoRefreshToken:true}});
  render();load();
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;return s?s:sb.auth.signInAnonymously().then(function(x){if(x.error)throw x.error;return x.data.session})})
  .then(function(s){me=s.user.id;sb.from('profiles').select('role').eq('id',me).maybeSingle().then(function(r){isAdmin=!!(r.data&&r.data.role==='admin')});load()})
  .catch(function(e){console.error(e);$('banner').style.display='';$('banner').textContent=T('authErr')});
})();
</script>
