.lang button{font:600 14px system-ui,sans-serif;padding:7px 14px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.lang button.on{background:var(--acc);color:var(--accink)}
h1{margin:0 0 4px;font-size:32px;line-height:1.15;letter-spacing:-.5px}
.alt{font-size:16px;font-weight:600;color:var(--mute);margin:0 0 12px}

.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.steps li:last-child{margin-bottom:0}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accink);font-weight:700;display:flex;align-items:center;justify-content:center}
.facts{display:grid;gap:8px;margin-bottom:22px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact b{display:block;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
select,input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-top:12px}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .btn{flex:1;margin:0}
.tabs .on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.trip .r{font-weight:700}.small{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:14px}

.msg{padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:7px;max-width:85%}
.msg.me{background:var(--me);margin-left:auto;text-align:right}
.stats{display:flex;gap:8px;margin-bottom:10px}.stats div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.danger{color:#c0392b;border-color:#c0392b}

function say(m){openDlg('<p>'+esc(m)+'</p><button class="btn p" id="okb" type="button" style="width:100%">'+T('ok')+'</button>');$('okb').onclick=closeDlg}
function ask(m,fn){openDlg('<p>'+esc(m)+'</p><div class="row"><button class="btn danger" id="yes" type="button">'+T('yes')+'</button><button class="btn" id="no" type="button">'+T('no')+'</button></div>');$('no').onclick=closeDlg;$('yes').onclick=function(){closeDlg();fn()}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
try{var ls=JSON.parse(localStorage.getItem('poputchik2')||'null');if(ls)S=ls}catch(e){}
function put(c,id){
  if(db){db.collection(c).doc(id).set(JSON.parse(JSON.stringify(S[c][id]))).catch(function(){say(T('saveErr'))})}
  else{try{localStorage.setItem('poputchik2',JSON.stringify(S))}catch(e){}}
  refresh();
}
function del(c,id){delete S[c][id];if(db)db.collection(c).doc(id).delete().catch(function(){});else try{localStorage.setItem('poputchik2',JSON.stringify(S))}catch(e){};refresh()}
function arr(c){return Object.keys(S[c]).map(function(k){var o=S[c][k];o.id=k;return o}).sort(function(a,b){return (b.ts||0)-(a.ts||0)})}
function refresh(){render();if(chatKey)drawChat();if(adminOn)drawAdm()}
function setRole(r,keep){
  role=r;if(!keep){chatKey=null;$('chat').style.display='none'}
  $('tDrv').classList.toggle('on',r==='drv');$('tPas').classList.toggle('on',r==='pas');
  $('fTitle').textContent=T(r==='drv'?'fDrv':'fPas');
  $('go').textContent=T(r==='drv'?'goDrv':'goPas');
  $('numRow').style.display=$('carRow').style.display=r==='drv'?'':'none';render();
}
function goForm(r){setRole(r);$('form').scrollIntoView({behavior:'smooth'})}
$('cDrv').onclick=function(){goForm('drv')};$('cPas').onclick=function(){goForm('pas')};
function render(){
  var f=$('from').value,t=$('to').value,list=arr('trips');
  if(role==='pas')list=list.filter(function(x){return x.from===f&&x.to===t});
  else list=list.filter(function(x){return x.owner===me});
  if(!list.length){$('list').innerHTML='<div class="card empty">'+T(role==='pas'?'emptyPas':'emptyDrv')+'</div>';return}
  $('list').innerHTML=list.map(function(x){
    var bks=x.bks||{},act='',own=x.owner===me,b=bks[me];
    if(role==='pas'){
      if(!b)act=x.seats>0?'<button class="btn p" type="button" data-book="'+x.id+'">'+T('book')+'</button>':'<div class="small">'+T('noSeats')+'</div>';
      else if(b.st==='pending')act='<div class="small">'+T('pending')+'</div>';
      else if(b.st==='accepted')act='<button class="btn p" type="button" data-chat="'+x.id+'_'+me+'">'+T('chatDrv')+'</button>';
      else act='<div class="small">'+T('declinedP')+'</div>';
      if(b)act+='<button class="btn" type="button" data-unbook="'+x.id+'">'+T('unbook')+'</button>';
    }else{
      var ks=Object.keys(bks);
      act=ks.length?ks.map(function(k,i){var q=bks[k];return '<div class="small" style="margin-top:8px">'+T('pas')+' '+(i+1)+(q.name?' ('+esc(q.name)+')':'')+'</div>'+
        (q.st==='pending'?'<div class="row"><button class="btn p" type="button" data-acc="'+x.id+'|'+k+'">'+T('acc')+'</button><button class="btn" type="button" data-dec="'+x.id+'|'+k+'">'+T('dec')+'</button></div>':
        q.st==='accepted'?'<button class="btn p" type="button" data-chat="'+x.id+'_'+k+'">'+T('openChat')+'</button>':'<div class="small">'+T('declined')+'</div>')}).join(''):'<div class="small">'+T('noReq')+'</div>';
    }
    return '<div class="card trip"><div class="r">'+esc(city(x.from))+' → '+esc(city(x.to))+'</div><div class="small">'+esc(x.date)+', '+esc(x.time)+' · '+T('seatsN')+': '+x.seats+' · '+x.price+' ₼ · '+T('driver')+': '+esc(x.driver)+'</div>'+(x.car?'<div class="small">'+T('carL')+': '+esc(x.car)+((own||(b&&b.st==='accepted'))&&x.plate?', '+T('plateL')+' '+esc(x.plate):'')+'</div>':'')+act+(role==='drv'&&own?'<div><button class="btn danger" type="button" data-cancel="'+x.id+'">'+T('cancelTrip')+'</button></div></div>':'<div><button class="btn rep" type="button" data-rep="'+x.id+'">'+T('report')+'</button></div></div>')}).join('');
}
$('tDrv').onclick=function(){setRole('drv')};$('tPas').onclick=function(){setRole('pas')};
$('from').onchange=$('to').onchange=function(){if(role==='pas')render()};
$('go').onclick=function(){
  if(role==='pas'){render();$('list').scrollIntoView({behavior:'smooth'});return}
  if($('from').value===$('to').value){say(T('diffCity'));return}
  var dn=$('dname').value.trim(),car=$('car').value.trim(),plate=$('plate').value.trim().toUpperCase();
  if(!dn||!car||!plate){say(T('needCar'));return}
  var id=uid();S.trips[id]={ts:Date.now(),from:$('from').value,to:$('to').value,date:$('date').value,time:$('time').value,seats:+$('seats').value||1,price:+$('price').value||0,driver:dn,car:car,plate:plate,owner:me,bks:{}};
  put('trips',id);
};
function setChatTitle(){var tid=chatKey.split('_')[0],x=S.trips[tid];$('cTitle').textContent=(role==='pas'?T('chatWithDrv')+': '+(x?x.driver:''):T('chatWithPas'))+(x?' · '+city(x.from)+' → '+city(x.to):'')}
$('list').onclick=function(e){
  var a=e.target.dataset||{};
  if(a.cancel){var cid=a.cancel;ask(T('askCancel'),function(){Object.keys(S.chats).forEach(function(k){if(k.indexOf(cid+'_')===0)del('chats',k)});del('trips',cid);chatKey=null;$('chat').style.display='none'})}
  else if(a.unbook){var tid=a.unbook;ask(T('askUnbook'),function(){var x=S.trips[tid];if(!x||!x.bks||!x.bks[me])return;if(x.bks[me].st==='accepted')x.seats++;delete x.bks[me];del('chats',tid+'_'+me);chatKey=null;$('chat').style.display='none';put('trips',tid)})}
  else if(a.book){var x=S.trips[a.book];if(!x)return;x.bks=x.bks||{};if(x.bks[me])return;x.bks[me]={st:'pending',name:''};put('trips',a.book)}
  else if(a.acc||a.dec){var p=(a.acc||a.dec).split('|'),x=S.trips[p[0]];if(!x||!x.bks||!x.bks[p[1]])return;
    if(a.acc){if(x.seats<1){say(T('noSeats'));return}x.bks[p[1]].st='accepted';x.seats--}else x.bks[p[1]].st='declined';put('trips',p[0])}
  else if(a.chat){chatKey=a.chat;setChatTitle();$('chat').style.display='';drawChat();$('chat').scrollIntoView({behavior:'smooth'})}
  else if(a.rep){var x=S.trips[a.rep];if(x)openReport(T('trip')+' '+city(x.from)+' → '+city(x.to)+', '+T('driver')+' '+x.driver)}
};
function drawChat(){var m=(S.chats[chatKey]||{}).m||[];$('msgs').innerHTML=m.map(function(x){return '<div class="msg'+(x.by===me?' me':'')+'">'+esc(x.t)+'</div>'}).join('')||'<div class="small">'+T('chatEmpty')+'</div>';$('msgs').scrollTop=1e6}
$('send').onclick=function(){var v=$('cin').value.trim();if(!v||!chatKey)return;var c=S.chats[chatKey]=S.chats[chatKey]||{m:[]};c.m=(c.m||[]).concat([{by:me,t:v}]);$('cin').value='';put('chats',chatKey)};
$('cin').onkeydown=function(e){if(e.key==='Enter')$('send').click()};
function openDlg(h){$('dlgBody').innerHTML=h;$('ov').style.display='flex'}
function closeDlg(){$('ov').style.display='none'}
$('ov').onclick=function(e){if(e.target===$('ov'))closeDlg()};
function openReport(target){
  openDlg('<h2>'+T('report')+'</h2><p class="small">'+esc(target)+'</p><label for="rr">'+T('reason')+'</label><select id="rr">'+['r1','r2','r3','r4','r5'].map(function(k){return '<option>'+T(k)+'</option>'}).join('')+'</select><label for="rt">'+T('details')+'</label><input id="rt" type="text" placeholder="'+T('detailsPh')+'"><button class="btn p" id="rsend" type="button" style="width:100%">'+T('sendRep')+'</button><button class="btn" id="rcl" type="button" style="width:100%">'+T('cancel')+'</button>');
  $('rcl').onclick=closeDlg;
  $('rsend').onclick=function(){var id=uid();S.reports[id]={ts:Date.now(),reason:$('rr').value,target:target,text:$('rt').value.trim(),at:new Date().toLocaleString(lang==='az'?'az-AZ':'ru-RU'),open:true};put('reports',id);
    openDlg('<h2>'+T('repSent')+'</h2><p>'+T('repSent2')+'</p><button class="btn p" id="ok" type="button" style="width:100%">'+T('close')+'</button>');$('ok').onclick=closeDlg};
}
$('sos').onclick=function(){openReport(T('general'))};
$('cRep').onclick=function(){openReport(T('chatL')+': '+$('cTitle').textContent)};
function drawAdm(){
  var trips=arr('trips'),reps=arr('reports'),seats=trips.reduce(function(a,x){return a+(+x.seats||0)},0),o=reps.filter(function(r){return r.open}).length;
  $('admStats').innerHTML='<div><b>'+trips.length+'</b><span class="small">'+T('stTrips')+'</span></div><div><b>'+seats+'</b><span class="small">'+T('stSeats')+'</span></div><div><b>'+Object.keys(S.chats).length+'</b><span class="small">'+T('stChats')+'</span></div>';
  $('admList').innerHTML=(trips.map(function(x){return '<div class="card trip"><div class="r">'+esc(city(x.from))+' → '+esc(city(x.to))+'</div><div class="small">'+esc(x.date)+', '+esc(x.time)+' · '+x.price+' ₼ · '+esc(x.driver)+(x.car?' · '+esc(x.car)+(x.plate?', '+esc(x.plate):''):'')+'</div><button class="btn danger" type="button" data-del="'+x.id+'">'+T('del')+'</button></div>'}).join('')||'<div class="empty">'+T('noTrips')+'</div>')+
  '<h2 style="margin-top:14px">'+T('reps')+' ('+o+' '+T('open')+')</h2>'+(reps.map(function(r){return '<div class="card trip"><div class="r">'+esc(r.reason||'')+'</div><div class="small">'+esc(r.target)+(r.text?' · '+esc(r.text):'')+' · '+esc(r.at)+'</div>'+(r.open?'<button class="btn" type="button" data-rc="'+r.id+'">'+T('closeRep')+'</button>':'<div class="small">'+T('closed')+'</div>')+'</div>'}).join('')||'<div class="empty">'+T('noReps')+'</div>');
}
$('admBtn').onclick=function(){
  if(adminOn){adminOn=false;$('adm').style.display='none';return}
  openDlg('<h2>'+T('pinT')+'</h2><input id="pin" type="password" inputmode="numeric" aria-label="'+T('pinT')+'"><button class="btn p" id="pok" type="button" style="width:100%">'+T('login')+'</button>');
  $('pok').onclick=function(){if($('pin').value!==ADMIN_PIN){$('pin').value='';$('pin').placeholder=T('wrong');return}closeDlg();adminOn=true;$('adm').style.display='';drawAdm();$('adm').scrollIntoView({behavior:'smooth'})};
};
$('adm').onclick=function(e){var d=e.target.dataset||{};
  if(d.del){Object.keys(S.chats).forEach(function(k){if(k.indexOf(d.del+'_')===0)del('chats',k)});del('trips',d.del)}
  if(d.rc&&S.reports[d.rc]){S.reports[d.rc].open=false;put('reports',d.rc)}};
$('admClear').onclick=function(){ask(T('askClear'),function(){['trips','chats'].forEach(function(c){Object.keys(S[c]).forEach(function(k){del(c,k)})});chatKey=null;$('chat').style.display='none'})};
setLang(lang);
</script>
</body>
</html>
