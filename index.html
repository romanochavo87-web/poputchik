function tripBks(tid){return S.bookings.filter(function(b){return b.trip_id===tid}).sort(function(a,b){return a.created_at<b.created_at?-1:1})}

function load(){
  if(!sb||!me)return Promise.resolve();
  var since=new Date(Date.now()-6*36e5).toISOString();
  return Promise.all([
    sb.from('trips').select('id,driver_id,driver_name,car_make,from_city,to_city,depart_at,seats_total,seats_taken,price_azn,created_at').gte('depart_at',since).order('depart_at'),
    sb.from('bookings').select('*')
  ]).then(function(r){
    if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;
    S.trips=r[0].data||[];S.bookings=r[1].data||[];refresh();
    var ids=S.trips.filter(function(t){var b=myBk(t.id);return isAdmin||t.driver_id===me||(b&&b.status==='accepted')}).map(function(t){return t.id});
    if(ids.length)return sb.rpc('trip_plates',{ids:ids}).then(function(p){(p.data||[]).forEach(function(x){S.plates[x.id]=x.car_plate});refresh()});
  }).catch(function(e){console.error(e)});
}

function render(){
  if(!sb||!me){$('list').innerHTML='<div class="card empty">'+T('loading')+'</div>';return}
  var f=$('from').value,t=$('to').value,now=Date.now(),list;
  if(role==='pas')list=S.trips.filter(function(x){return x.from_city===f&&x.to_city===t&&new Date(x.depart_at).getTime()>now-36e5});
  else list=S.trips.filter(function(x){return x.driver_id===me});
  if(!list.length){$('list').innerHTML='<div class="card empty">'+T(role==='pas'?'emptyPas':'emptyDrv')+'</div>';return}
  $('list').innerHTML=list.map(function(x){
    var own=x.driver_id===me,b=myBk(x.id),act='';
    if(role==='pas'){
      if(own)act='';
      else if(!b)act=left(x)>0?'<button class="btn p" type="button" data-book="'+x.id+'">'+T('book')+'</button>':'<div class="small">'+T('noSeats')+'</div>';
      else if(b.status==='pending')act='<div class="small">'+T('pending')+'</div>';
      else if(b.status==='accepted')act='<button class="btn p" type="button" data-chat="'+b.id+'">'+T('chatDrv')+'</button>';
      else act='<div class="small">'+T('declinedP')+'</div>';
      if(b)act+='<button class="btn" type="button" data-unbook="'+b.id+'">'+T('unbook')+'</button>';
    }else{
      var ks=tripBks(x.id);
      act=ks.length?ks.map(function(q,i){return '<div class="small" style="margin-top:8px">'+T('pas')+' '+(i+1)+(q.passenger_name?' ('+esc(q.passenger_name)+')':'')+'</div>'+
        (q.status==='pending'?'<div class="row"><button class="btn p" type="button" data-acc="'+q.id+'">'+T('acc')+'</button><button class="btn" type="button" data-dec="'+q.id+'">'+T('dec')+'</button></div>':
        q.status==='accepted'?'<button class="btn p" type="button" data-chat="'+q.id+'">'+T('openChat')+'</button>':'<div class="small">'+T('declined')+'</div>')}).join(''):'<div class="small">'+T('noReq')+'</div>';
    }
    var showPlate=own||(b&&b.status==='accepted');
    return '<div class="card trip"><div class="r">'+esc(city(x.from_city))+' → '+esc(city(x.to_city))+'</div><div class="small">'+fmt(x.depart_at)+' · '+T('seatsLeft')+': '+left(x)+' · '+(x.price_azn!=null?x.price_azn+' ₼ · ':'')+T('driver')+': '+esc(x.driver_name)+'</div>'+
      (x.car_make?'<div class="small">'+T('carL')+': '+esc(x.car_make)+(showPlate&&(S.plates[x.id]||'')?', '+T('plateL')+' '+esc((S.plates[x.id]||'')):'')+'</div>':'')+act+
      (own?'<div><button class="btn danger" type="button" data-cancel="'+x.id+'">'+T('cancelTrip')+'</button></div></div>':'<div><button class="btn rep" type="button" data-rep="'+x.id+'">'+T('report')+'</button></div></div>')}).join('');
}

  var dn=$('dname').value.trim(),car=$('car').value.trim(),plate=$('plate').value.trim().toUpperCase();

  try{localStorage.setItem('poputchikName',dn)}catch(e){}
  $('go').disabled=true;
  sb.from('trips').insert({driver_id:me,driver_name:dn,car_make:car,car_plate:plate,from_city:$('from').value,to_city:$('to').value,depart_at:dt.toISOString(),seats_total:Math.min(6,Math.max(1,+$('seats').value||1)),price_azn:Math.max(0,+$('price').value||0)})
    .then(function(r){$('go').disabled=false;if(r.error)return fail(r.error);load().then(function(){$('list').scrollIntoView({behavior:'smooth'})})});

var GEO={'Баку (Bakı)':[40.41,49.87],'Гянджа (Gəncə)':[40.68,46.36],'Сумгаит (Sumqayıt)':[40.59,49.67],'Ленкорань (Lənkəran)':[38.75,48.85],'Шеки (Şəki)':[41.19,47.17],'Мингечевир (Mingəçevir)':[40.77,47.05],'Ширван (Şirvan)':[39.93,48.92],'Ханкенди (Xankəndi)':[39.82,46.76],'Нафталан (Naftalan)':[40.51,46.82],'Губа (Quba)':[41.36,48.51],'Габала (Qəbələ)':[40.98,47.85],'Загатала (Zaqatala)':[41.63,46.64],'Билясувар (Biləsuvar)':[39.46,48.55],'Абшеронский район (Abşeron)':[40.45,49.75],'Хызинский район (Xızı)':[40.91,49.07],'Агсуинский район (Ağsu)':[40.57,48.40],'Исмаиллинский район (İsmayıllı)':[40.79,48.15],'Гобустанский район (Qobustan)':[40.53,48.94],'Шемахинский район (Şamaxı)':[40.63,48.64],'Дашкесанский район (Daşkəsən)':[40.52,46.08],'Геранбойский район (Goranboy)':[40.61,46.79],'Гёйгёльский район (Göygöl)':[40.59,46.32],'Самухский район (Samux)':[40.76,46.41],'Агджабединский район (Ağcabədi)':[40.05,47.46],'Агдамский район (Ağdam)':[39.98,46.93],'Бардинский район (Bərdə)':[40.37,47.13],'Физулинский район (Füzuli)':[39.60,47.14]};
var FUEL_PRICE=1.15,L_PER_100=8;
function routeKm(a,b){var p=GEO[a],q=GEO[b];if(!p||!q||a===b)return 0;var r=Math.PI/180,dl=(q[0]-p[0])*r,dn=(q[1]-p[1])*r,h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(p[0]*r)*Math.cos(q[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);return Math.round(6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))*1.25)}
function fuelHint(){
  var box=$('fuel');if(role!=='drv'){box.style.display='none';return}
  var km=routeKm($('from').value,$('to').value);
  if(!km){box.style.display='';box.innerHTML=esc(T('fuelNote'));return}
  var fuel=km*L_PER_100/100*FUEL_PRICE,seats=Math.min(6,Math.max(1,+$('seats').value||1)),n=seats+1,per=fuel/n,price=+$('price').value||0;
  box.style.display='';
  box.innerHTML=esc(T('fuelHint').replace('{km}',km).replace('{fuel}',Math.round(fuel)).replace('{n}',n).replace('{per}',Math.max(1,Math.round(per))))+'<br>'+esc(T('fuelNote'))+(price>Math.max(3,per*2)?'<br><span class="warn">'+esc(T('fuelHigh'))+'</span>':'');
}
['from','to','seats','price'].forEach(function(id){$(id).addEventListener('input',fuelHint);$(id).addEventListener('change',fuelHint)});
